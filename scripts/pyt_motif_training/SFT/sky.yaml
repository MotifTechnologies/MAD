resources:
  cloud: kubernetes
  accelerators: MI250:1
  cpus: 1
  memory: 1
  image_id: harbor.harbor.svc.cluster.local:40080/modelco/rocm/pytorch-training:v25.6
num_nodes: 1
setup:
  pip install accelerate transformers==4.51.3 datasets loguru tqdm kernels
config:
  kubernetes:
    pod_config:
      spec:
        imagePullSecrets:
          - name: harbor-cfg
        containers:
          - volumeMounts:
              - mountPath: /motiftech/model
                name: nfs-vast
        volumes:
          - name: nfs-vast
            persistentVolumeClaim:
              claimName: nfs-pvc

run: |

  ### clone MAD repository
  git clone https://github.com/MotifTechnologies/MAD.git
  cd MAD
  git checkout add_motif
  cd scripts/pyt_motif_training/SFT
  ### run!
  accelerate launch --config_file accelerate_config_1node.yaml train_motif.py
